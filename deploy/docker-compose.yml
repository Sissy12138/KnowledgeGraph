services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["..:/app"]
    command: sh -c "pip install -r backend-a/requirements.txt && PYTHONPATH=. python -m backend.api --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    volumes: ["..:/app"]
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    depends_on: [backend]
